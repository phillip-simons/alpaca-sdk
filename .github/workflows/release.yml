# Publishes to crates.io from a `v*` tag, using trusted publishing.
#
# No API token is stored anywhere. The job proves its identity to crates.io over
# OIDC and receives a token that lives for 30 minutes and is revoked in a post
# step when the job ends.
#
# **The filename is load-bearing.** crates.io's trusted publisher configuration
# names this file, so renaming it silently breaks publishing until the
# configuration is updated to match.
name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Read-only by default; the publish job asks for the OIDC token it needs.
permissions:
  contents: read

# Every `uses:` below is pinned to a commit SHA, with the ref it was resolved
# from kept as a trailing comment. A tag is a movable pointer: whoever controls
# the action repository can repoint `@v7` at new code without any change here.
# That matters most in this file, because `publish` mints a live crates.io token
# over OIDC and a publish cannot be withdrawn.
#
# `dtolnay/rust-toolchain` needs the extra `toolchain:` input wherever it is
# pinned. That action has no version tags — `stable`, `nightly` and `1.88.0` are
# *branches*, and it reads the toolchain to install from the ref it was invoked
# by. Pinned to a SHA, the ref is the SHA, so the toolchain has to be named
# explicitly or rustup is asked for a release called `4360b52…`.

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # `just ci` reaches past stable twice: `cargo +1.88.0` for the MSRV build,
      # and `cargo +nightly` for `doc-docsrs`, the rustdoc build with `--cfg
      # docsrs` that turns on `feature(doc_cfg)`. Both are installed before
      # stable, because this action makes whichever toolchain it installed last
      # the default — put either after stable and every other recipe would
      # quietly run on it instead.
      #
      # Nightly earns its place here only through `doc-docsrs`. If that recipe
      # ever leaves `just ci`, this step leaves with it.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.88.0
        with:
          toolchain: "1.88.0"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # nightly
        with:
          toolchain: nightly
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: just,cargo-deny,cargo-semver-checks

      # Selected by name, not by `.packages[0]`. This is a workspace now, and
      # the order `cargo metadata` lists members in is not part of its contract
      # — reading index 0 would compare the tag against whichever package
      # happened to come first, and `alpaca-sdk-macros` carries its own version.
      - name: Tag must match the crate version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "alpaca-sdk") | .version')"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag is v$tag but Cargo.toml says $crate"
            exit 1
          fi
          echo "releasing $crate"

      # `alpaca-sdk` pins `alpaca-sdk-macros` with `=`, following serde's
      # precedent for a derive crate whose output the parent's own source
      # depends on. A pin naming a version that is not what this tag will
      # publish resolves against crates.io instead of the sibling, so a caller
      # gets a derive built from different source than the SDK was tested
      # against. Cheap to check here, invisible everywhere else.
      - name: The macros pin must name the version being published
        run: |
          set -euo pipefail
          # Re-derived, not carried over: each `run:` is its own shell, and
          # under `set -u` a variable from the step above is a failure rather
          # than an empty string.
          tag="${GITHUB_REF_NAME#v}"
          macros="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "alpaca-sdk-macros") | .version')"
          pin="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "alpaca-sdk") | .dependencies[]
                     | select(.name == "alpaca-sdk-macros") | .req')"
          if [ "$pin" != "=$macros" ]; then
            echo "::error::alpaca-sdk depends on alpaca-sdk-macros $pin, but that crate is $macros"
            exit 1
          fi
          # And the lockstep rule from RELEASING.md step 1b. The pin agreeing
          # with the macros crate is not enough on its own: forget to bump
          # `macros/Cargo.toml` and both still agree, at a version already on
          # crates.io. `cargo publish --workspace --dry-run` only *warns* about
          # an already-indexed version and exits 0, so `verify` would pass and
          # the failure would land in `publish` — after the approval prompt.
          if [ "$macros" != "$tag" ]; then
            echo "::error::alpaca-sdk-macros is $macros but this tag publishes $tag — bump macros/Cargo.toml and the = pin together (RELEASING.md step 1b)"
            exit 1
          fi
          echo "macros pinned at $pin, in lockstep with $tag"

      # The repo's own definition of ready-to-publish: `just ci` (fmt, clippy,
      # rustdoc, tests, feature combinations, MSRV, cargo-deny) plus
      # cargo-semver-checks and a packaging dry run.
      - run: just publish-dry

      # Printed so the tarball contents are on the record next to the approval,
      # rather than something to go and check afterwards.
      # Both tarballs. `cargo package --list` without `-p` resolves to the root
      # package, so before the workspace this printed everything there was and
      # after it printed half.
      - name: What would be uploaded
        run: |
          set -euo pipefail
          for crate in alpaca-sdk-macros alpaca-sdk; do
            echo "::group::$crate"
            cargo package --list --all-features -p "$crate"
            echo "::endgroup::"
          done

  # The platforms routine CI no longer runs on every commit.
  #
  # Runs in parallel with `verify`, and `publish` waits for both — so a failure
  # on either shows up before the approval prompt rather than after it.
  cross-platform:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # `--locked` because a release must test the dependency versions it is
      # about to publish, not whatever resolves today.
      #
      # Deliberately *not* `--workspace`, where CI's `test` job is.
      # `alpaca-sdk-macros` carries trybuild compile-fail tests, and their
      # `.stderr` files pin rustc's and syn's diagnostic formatting — neither of
      # which is a stable interface, and neither of which has anything to say
      # about macOS or Windows. Running them here would let a reworded
      # diagnostic stop a publish. They run on Linux and stable, once, in CI.
      - run: cargo test --all-features --locked

  publish:
    name: publish
    needs: [verify, cross-platform]
    runs-on: ubuntu-latest
    # Gated: the job waits here for a reviewer, and the same environment name is
    # part of the trust configuration on crates.io.
    environment: release
    permissions:
      # Must be job-level. This is what lets the runner mint an OIDC token.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
        id: auth

      # `--workspace` publishes `alpaca-sdk-macros` and then `alpaca-sdk`, in
      # that order, from one invocation. Two `cargo publish` calls would not
      # work: the second needs the first to be live and indexed, and crates.io
      # does not index synchronously.
      #
      # **Both crates need a trusted publisher configured on crates.io**, and a
      # trusted publisher can only be added to a crate that already exists — so
      # `alpaca-sdk-macros` needs one manual publish before this line can work.
      # See RELEASING.md; `alpaca-sdk` needed the same for `0.0.0`.
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
