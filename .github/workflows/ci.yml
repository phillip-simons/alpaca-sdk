name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Which jobs need to run at all.
  #
  # A docs-only change does not need the compiler, but the nine Rust jobs below
  # are *required* status checks — so they cannot simply be filtered out of the
  # workflow. A workflow that never runs never reports, and branch protection
  # waits for a report that will never arrive, which blocks the pull request
  # permanently.
  #
  # Skipping at the *job* level instead is what works: a skipped job still
  # reports, and a skipped required check counts as satisfied. Hence the `needs`
  # and `if` on every job rather than a `paths` filter up at `on:`.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              # Anything the compiler, the tests, or the dependency audit read.
              # `fixtures/` counts: the tests read those payloads at runtime.
              # This file counts too — a change to CI should prove itself.
              - 'src/**'
              - 'tests/**'
              - 'examples/**'
              - 'fixtures/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - '.github/workflows/ci.yml'

  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  features:
    name: feature combinations
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Each surface must build alone; a missing cfg gate only shows up here.
      - run: cargo check --no-default-features --features rustls-tls
      - run: cargo check --no-default-features --features trading,rustls-tls
      - run: cargo check --no-default-features --features data,rustls-tls
      - run: cargo check --no-default-features --features broker,rustls-tls
      - run: cargo check --no-default-features --features trading,data,broker,blocking,polars,native-tls

  msrv:
    name: minimum supported rust version
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # polars pulls sysinfo, which needs 1.95. It is off by default, so it
      # does not set the crate's floor; every other feature is covered here.
      - run: >
          cargo check --no-default-features
          --features trading,data,broker,blocking,rustls-tls

  deny:
    name: cargo-deny
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  docs:
    name: rustdoc
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings --cfg docsrs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --all-features --no-deps

  coverage:
    name: coverage
    # Push-only. Nothing gates on the number — it is a map of what no test has
    # ever run, not a target — so measuring it on every pull request would spend
    # an instrumented test run on a report no one is blocked by. `on.push` here
    # is `main` alone.
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Measure, and write it to the run summary
        run: |
          set -euo pipefail
          {
            echo '### Coverage'
            echo
            echo 'Where no test has ever run. Not a threshold — see `just cov`.'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov --all-features --summary-only | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
