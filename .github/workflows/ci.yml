name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Which jobs need to run at all.
  #
  # A docs-only change does not need the compiler, but `all checks` — which
  # gates on the Rust jobs below — is a *required* status check, so they cannot
  # simply be filtered out of the workflow. A workflow that never runs never
  # reports, and branch protection waits for a report that will never arrive,
  # which blocks the pull request permanently.
  #
  # Skipping at the *job* level instead is what works: a skipped job still
  # reports, and a skipped required check counts as satisfied. Hence the `needs`
  # and `if` on every job rather than a `paths` filter up at `on:`.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      coverage_doc: ${{ steps.filter.outputs.coverage_doc }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              # Anything the compiler, the tests, or the dependency audit read.
              # `fixtures/` counts: the tests read those payloads at runtime.
              # This file counts too — a change to CI should prove itself.
              - 'src/**'
              - 'tests/**'
              - 'examples/**'
              - 'fixtures/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - '.github/workflows/ci.yml'
            coverage_doc:
              # What COVERAGE.md is generated from, plus the generator and the
              # file itself. Deliberately not the `code` filter: `tests/` and
              # `fixtures/` cannot change the report, and a hand-edit of
              # COVERAGE.md must trip this job even though it touches no code.
              - 'src/**'
              - 'scripts/coverage.py'
              - 'COVERAGE.md'
              - '.github/workflows/ci.yml'

  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux alone on every push and pull request. macOS and Windows moved to
        # the release workflow, which runs them before anything is published.
        #
        # Windows was most of the wall-clock of a routine run — around ten
        # minutes of it — and what that bought was catching platform-specific
        # bugs in a pure-Rust HTTP client and a msgpack decoder, which is a
        # category that has not produced one yet. Paying it once per release
        # rather than once per commit keeps the coverage and returns the loop.
        #
        # The matrix stays a matrix on purpose: adding a platform back is a
        # one-line change, and `all checks` is the only required status check,
        # so it does not touch branch protection either way.
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  features:
    name: feature combinations
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Each surface must build alone; a missing cfg gate only shows up here.
      #
      # `--all-targets` because plain `cargo check` builds only the library: an
      # unguarded *test* file is just as broken under a reduced feature set, and
      # without this the matrix cannot see it. `tests/integration/enum_parity.rs`
      # was in exactly that state, and this job as previously written would not
      # have caught it — `just features` did, which is the wrong way round.
      - run: cargo check --all-targets --no-default-features --features rustls-tls
      - run: cargo check --all-targets --no-default-features --features trading,rustls-tls
      - run: cargo check --all-targets --no-default-features --features data,rustls-tls
      - run: cargo check --all-targets --no-default-features --features broker,rustls-tls
      # `polars` alone, to pin the implication: it enables `data`, because the
      # frame conversion is for the market data collections and the feature would
      # otherwise compile all of polars and expose nothing.
      - run: cargo check --all-targets --no-default-features --features polars,rustls-tls
      # `blocking` alone. It is generic over the client rather than a mirrored
      # API, so it compiles without any surface enabled — worth knowing stays
      # true, since a mirrored one would not.
      - run: cargo check --all-targets --no-default-features --features blocking,rustls-tls
      - run: cargo check --all-targets --no-default-features --features trading,data,broker,blocking,polars,native-tls

  msrv:
    name: minimum supported rust version
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # polars pulls sysinfo, which needs 1.95. It is off by default, so it
      # does not set the crate's floor; every other feature is covered here.
      - run: >
          cargo check --no-default-features
          --features trading,data,broker,blocking,rustls-tls

  deny:
    name: cargo-deny
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  docs:
    name: rustdoc
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings --cfg docsrs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --all-features --no-deps
      # And once per surface. An intra-doc link that crosses a feature boundary
      # resolves under --all-features and dangles everywhere else, so the
      # all-features build above cannot see it. This moved out of `just check`,
      # where it was two thirds of the rustdoc work on every commit, to here.
      - run: cargo doc --no-deps --no-default-features --features trading,rustls-tls
      - run: cargo doc --no-deps --no-default-features --features data,rustls-tls
      - run: cargo doc --no-deps --no-default-features --features broker,rustls-tls

  coverage-doc:
    name: COVERAGE.md is current
    needs: changes
    if: needs.changes.outputs.coverage_doc == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # COVERAGE.md says "Do not edit by hand — run `just coverage`", and
      # CONTRIBUTING makes reading it step 1 of adding a route. Nothing checked
      # that the committed file still matched the crate, so a route added
      # without regenerating left the document quietly wrong — and the one
      # thing a coverage report cannot afford is to be believed while stale.
      #
      # No Rust toolchain: `scripts/coverage.py` reads `src/` as text.
      #
      # This job reaches the network, because `just coverage` depends on `just
      # specs`, which fetches the OpenAPI documents from alpaca-java rather
      # than vendoring 1.2MB of YAML that changes on Alpaca's schedule. So a
      # failure here means one of two things, and the diff says which: either
      # the committed report is out of date with this crate, or it is out of
      # date with the API because the specs moved upstream. Both are worth a
      # human look; neither should land silently.
      - name: Regenerate and compare
        run: |
          set -euo pipefail
          just coverage
          if ! git diff --exit-code -- COVERAGE.md; then
            echo "::error file=COVERAGE.md::COVERAGE.md is out of date — run \`just coverage\` and commit the result"
            exit 1
          fi
          echo "COVERAGE.md matches what the generator produces"

  # The single required status check.
  #
  # Branch protection names check *runs*, and a matrix job that is skipped
  # cannot expand its own name: it reports once, literally, as
  # `test (${{ matrix.os }})`. So requiring `test (ubuntu-latest)` and its two
  # siblings means requiring three names that never arrive on a documentation
  # change — the pull request sits blocked forever, which is the same deadlock
  # the job-level skip was meant to avoid, arriving by a subtler route.
  #
  # Depending on every job and requiring only this one sidesteps all of it.
  # Renaming a job, adding a platform to the matrix, or skipping the lot no
  # longer touches the protection configuration.
  #
  # `always()` rather than `!cancelled()`: a cancelled run should report a
  # failure here, not a skip that protection would accept.
  gate:
    name: all checks
    needs: [changes, fmt, clippy, test, features, msrv, deny, docs, coverage-doc]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded or was deliberately skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::a job reported '$result'"; exit 1 ;;
            esac
          done
          echo "every job succeeded or was skipped"

  # Named `line-coverage`, not `coverage`, because `coverage-doc` above is also
  # about coverage and means something else entirely: that job checks which
  # documented *routes* the crate implements, this one measures which *lines* a
  # test has executed. Two unrelated numbers under one word is how someone
  # reads a green `coverage` check as an answer to the question the other job
  # asks.
  line-coverage:
    name: line coverage
    # Push-only. Nothing gates on the number — it is a map of what no test has
    # ever run, not a target — so measuring it on every pull request would spend
    # an instrumented test run on a report no one is blocked by. `on.push` here
    # is `main` alone.
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Measure, and write it to the run summary
        run: |
          set -euo pipefail
          {
            echo '### Line coverage'
            echo
            echo 'Where no test has ever run. Not a threshold — see `just cov`.'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov --all-features --summary-only | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
