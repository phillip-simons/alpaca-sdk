# Dependency updates.
#
# `cargo-deny` reports advisories — weekly, and on every push — but reporting is
# not fixing, and a report against a dependency of an already-published version
# needs a release to resolve. This opens the pull request that does it.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      # Conventional Commits, matching .github/CONTRIBUTING.md.
      prefix: build
      include: scope
    groups:
      # One pull request for the routine patch churn, so the interesting
      # updates are not buried among them.
      patch-updates:
        update-types: ["patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    ignore:
      # `dtolnay/rust-toolchain@1.88.0` is not a dependency behind on its
      # updates — that version *is* the MSRV, and the whole purpose of the job
      # pinning it is to build against the oldest Rust this crate claims to
      # support. Dependabot cannot tell the difference and opened a pull request
      # to "bump" it to 1.100.0, which would have left the MSRV unverified while
      # the job carried on reporting green.
      #
      # The MSRV moves when `rust-version` in Cargo.toml moves, by hand, as a
      # deliberate and breaking-ish decision. Never automatically.
      #
      # Scoped to minor and patch, which is the shape that bad pull request had
      # (1.88.0 -> 1.100.0), rather than to the action as a whole. The whole-
      # action form used to be here, and it silently covered the `@stable` and
      # `@nightly` uses too — harmless while those were tag refs that resolve
      # themselves, and not harmless now that all three are commit SHAs. A SHA
      # is exactly as old as the day it was pinned, so an action excluded from
      # updates is an action excluded from *security* updates.
      #
      # Dependabot names a github-actions dependency by repository, with no way
      # to say "this `uses:` line but not that one", so this is as narrow as the
      # schema goes: a major-version update still opens a pull request, and the
      # MSRV pin is protected from the automated Rust-version churn.
      - dependency-name: dtolnay/rust-toolchain
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
