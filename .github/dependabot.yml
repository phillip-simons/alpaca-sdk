# Dependency updates.
#
# `cargo-deny` reports advisories — weekly, and on every push — but reporting is
# not fixing, and a report against a dependency of an already-published version
# needs a release to resolve. This opens the pull request that does it.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      # Conventional Commits, matching .github/CONTRIBUTING.md.
      prefix: build
      include: scope
    groups:
      # One pull request for the routine patch churn, so the interesting
      # updates are not buried among them.
      patch-updates:
        update-types: ["patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    ignore:
      # `dtolnay/rust-toolchain@1.88.0` is not a dependency behind on its
      # updates — that version *is* the MSRV, and the whole purpose of the job
      # pinning it is to build against the oldest Rust this crate claims to
      # support. Dependabot cannot tell the difference and opened a pull request
      # to "bump" it to 1.100.0, which would have left the MSRV unverified while
      # the job carried on reporting green.
      #
      # The MSRV moves when `rust-version` in Cargo.toml moves, by hand, as a
      # deliberate and breaking-ish decision. Never automatically.
      - dependency-name: dtolnay/rust-toolchain
