[package]
name = "alpaca-sdk"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
description = "Unofficial Rust SDK for the Alpaca trading, market data, and broker APIs"
authors = ["Phillip Simons <phillip@simons.gg>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/phillip-simons/alpaca-sdk"
documentation = "https://docs.rs/alpaca-sdk"
keywords = ["alpaca", "trading", "stocks", "crypto", "finance"]
categories = ["api-bindings", "finance"]
# `fixtures/` is deliberately included: `tests/` ships too, and every one of
# those tests reads a captured payload out of it at runtime. Shipping tests
# that cannot run would be worse than shipping neither. It costs 135KB.
exclude = [".github/"]

[features]
default = ["trading", "data", "rustls-tls"]

# API surfaces.
trading = ["_ws", "_sse"]
data = ["_ws", "_sse", "dep:rmp-serde", "dep:rmpv"]
# The broker API acts on behalf of trading accounts and reuses their models
# (orders, positions, watchlists), exactly as alpaca-py's broker module imports
# from alpaca.trading.
broker = ["trading", "_sse"]

# Ergonomics.
blocking = ["tokio/rt-multi-thread"]
polars = ["dep:polars"]

# TLS backends. Pick exactly one.
rustls-tls = ["reqwest/rustls", "tokio-tungstenite?/rustls-tls-webpki-roots"]
native-tls = ["reqwest/native-tls", "tokio-tungstenite?/native-tls"]

# Internal: websocket transport, shared by the trading and data streams.
_ws = ["dep:tokio-tungstenite"]
# Internal: server-sent-event transport. Not broker-only — the trading API has
# an activity stream and the market data API a corporate-actions stream.
_sse = ["dep:eventsource-stream"]

[dependencies]
async-stream = "0.3.6"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
eventsource-stream = { version = "0.2.3", optional = true }
futures-util = "0.3.34"
polars = { version = "0.55.2", default-features = false, features = [
    "lazy",
    "dtype-full",
], optional = true }
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "stream",
    "charset",
    "http2",
    "query",
] }
rmp-serde = { version = "1.3.1", optional = true }
rmpv = { version = "1.3.1", optional = true }
rust_decimal = "1.42.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["time", "sync", "rt", "macros"] }
tokio-tungstenite = { version = "0.30.0", optional = true }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["serde", "v4"] }

[build-dependencies]
rustc_version = "0.4.1"

[dev-dependencies]
pretty_assertions = "1.4.1"
rmp-serde = "1.3.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
doc_markdown = "warn"
must_use_candidate = "allow"
module_name_repetitions = "allow"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
